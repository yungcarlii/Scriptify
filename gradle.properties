# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.14.10

# Mod Properties
mod_version=2.0.2
maven_group=scriptify.function

# Dependencies
fabric_api_version=0.141.6+1.21.11
sgui_version=1.12.0+1.21.11

# Minecraft 1.21.11 targets Java 21; the Gradle JVM may be newer. Which JDK runs Gradle is a property
# of the machine, not the project: set org.gradle.java.home in ~/.gradle/gradle.properties if the
# default Java is too old. CI picks its own with setup-java.
