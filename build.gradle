plugins {
	// 'fabric-loom', not 'net.fabricmc.fabric-loom'. They are the same plugin and they are not
	// interchangeable: applying it under the net.fabricmc id sets disableObfuscation and
	// finalises it, which is correct for the unobfuscated jars Minecraft ships from 26.x and
	// wrong for everything before. 1.21.11 is obfuscated, so declaring a mapping set under
	// that id fails with "Cannot use Mojang mappings in a non-obfuscated environment" - which
	// reads like a statement about Minecraft and is really a statement about this line.
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven {
		name = "Nucleoid"
		url = "https://maven.nucleoid.xyz/"
	}
}

loom {
	mods {
		"scriptify" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 ships obfuscated - 698 obfuscated classes in the server jar against 28 that keep
	// their names - so the source has to be compiled against a mapping set. Mojang's own, since
	// this codebase is written in them (ServerPlayer, not ServerPlayerEntity).
	//
	// This is the line that decides which Loom can build the project: Loom 1.17.x assumes the
	// unobfuscated jars Minecraft ships from 26.x onward and refuses a mapping set outright
	// ("Cannot use Mojang mappings in a non-obfuscated environment"), so 1.21.11 needs a Loom
	// from its own era. See loom_version in gradle.properties.
	mappings loom.layered {
		officialMojangMappings()
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	//
	// modImplementation rather than implementation: a mod dependency has to be remapped from
	// intermediary into the namespace this project compiles in. Pulled in as a plain library
	// its access wideners stay in intermediary and Loom rejects the jar while Minecraft is
	// still being set up, long before anything compiles.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation include("eu.pb4:sgui:${project.sgui_version}")

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

tasks.named("test") {
	useJUnitPlatform()
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	// Ships inside the jar because two of the licences below require it: sgui is LGPL-3.0 and must be
	// identified with its licence, and SkinRestorer is MIT and its notice has to travel with the code.
	from("THIRD-PARTY-NOTICES.md") {
		rename { "THIRD-PARTY-NOTICES_${projectName}.md" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
